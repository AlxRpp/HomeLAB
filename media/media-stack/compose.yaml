# Servarr-Stack für Unraid
#
# Abgeleitet von https://github.com/TechHutTV/homelab/tree/main/media
# Angepasst für Unraid — siehe 03-media.md, Abschnitt 3, für die
# Begründung jeder einzelnen Abweichung.
#
# WICHTIG: Alle Config-Pfade sind ABSOLUT nach /mnt/user/appdata/.
# Das Original nutzt relative Pfade (./sonarr:/config). Auf Unraid liegt
# das Compose-Projekt unter /boot/config/plugins/compose.manager/projects/
# — also auf dem USB-Boot-Stick. Relative Pfade würden Datenbanken dorthin
# schreiben. Niemals ändern.

networks:
  servarrnetwork:
    name: servarrnetwork
    ipam:
      config:
        - subnet: 172.39.0.0/24

services:

  # ---------------------------------------------------------------------
  # VPN — alles darunter mit network_mode: service:gluetun läuft im Tunnel
  # ---------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun   # Auf Unraid nativ vorhanden, kein LXC-Fix nötig
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_GLUETUN}
    ports:
      - 8080:8080   # qBittorrent WebUI
      - 6881:6881   # qBittorrent Torrent-Port (TCP)
      - 6881:6881/udp
      - 6789:6789   # NZBGet
      - 9696:9696   # Prowlarr
      - 8191:8191   # FlareSolverr
    volumes:
      - /mnt/user/appdata/gluetun:/gluetun
    env_file:
      - .env
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Download-Clients
  # ---------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      # Kein TORRENTING_PORT: Bei ProtonVPN ist der weitergeleitete Port
      # dynamisch und ändert sich bei jedem Reconnect. Gluetun holt ihn
      # per NAT-PMP und setzt ihn über die qBittorrent-API (siehe .env,
      # VPN_PORT_FORWARDING_UP_COMMAND).
    volumes:
      - /mnt/user/appdata/qbittorrent:/config
      - /mnt/user/media:/data
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s

  # Startet qbittorrent neu, wenn dessen Healthcheck kippt (VPN-Aussetzer).
  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=${TZ}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/nzbget:/config
      - /mnt/user/media:/data
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    network_mode: service:gluetun

  # ---------------------------------------------------------------------
  # Indexer
  # ---------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/prowlarr:/config
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # *arr-Apps — bewusst NICHT im VPN-Tunnel.
  # Sie reden nur mit Prowlarr, den Download-Clients und Metadaten-APIs
  # (TMDb/TVDb). Kein Grund, sie durch den Tunnel zu zwingen, und im
  # eigenen Netz erreichbar zu halten ist deutlich einfacher zu debuggen.
  # ---------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/sonarr:/config
      - /mnt/user/media:/data
    ports:
      - 8989:8989
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_SONARR}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/radarr:/config
      - /mnt/user/media:/data
    ports:
      - 7878:7878
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_RADARR}

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/lidarr:/config
      - /mnt/user/media:/data
    ports:
      - 8686:8686
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_LIDARR}

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/bazarr:/config
      - /mnt/user/media:/data
    ports:
      - 6767:6767
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_BAZARR}

  # Nachfolger von Overseerr und Jellyseerr (Merge Februar 2026).
  #
  # ACHTUNG, Ausnahme im ganzen Stack: Dieses Image ignoriert PUID/PGID
  # und läuft fest als "node:node" = UID/GID 1000. Der appdata-Ordner
  # muss deshalb 1000:1000 gehören, nicht 99:100 wie überall sonst:
  #
  #   chown -R 1000:1000 /mnt/user/appdata/seerr
  #
  # Ohne das startet der Container nicht und wirft in Dauerschleife
  # "EACCES: permission denied, mkdir '/app/config/logs/'".
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/seerr:/app/config
    ports:
      - 5055:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_SEERR}

  # ---------------------------------------------------------------------
  # Jellyfin
  # /dev/dri = Intel Quick Sync. Existiert NUR auf echter Hardware mit
  # iGPU — in der Proxmox-Test-VM ohne Passthrough fehlt das Device und
  # der Container startet nicht. Dort diesen Block auskommentieren.
  # ---------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL}
    volumes:
      - /mnt/user/appdata/jellyfin:/config
      - /mnt/user/media:/data
    # AUF DER ECHTEN MASCHINE EINKOMMENTIEREN — Intel Quick Sync.
    # In der Proxmox-Test-VM gibt es kein /dev/dri (kein iGPU-Passthrough),
    # der Container würde nicht starten. Ohne Quick Sync läuft Jellyfin
    # trotzdem, transcodiert dann aber auf der CPU. Solange der Client das
    # Format direkt abspielen kann (Direct Play), wird gar nicht
    # transcodiert und es fällt nicht auf.
    #devices:
    #  - /dev/dri:/dev/dri
    ports:
      - 8096:8096
      - 7359:7359/udp   # Service Discovery
      - 1900:1900/udp   # Client Discovery
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_JELLYFIN}
